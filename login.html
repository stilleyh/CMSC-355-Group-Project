<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Just login. There will be seperate create login page">
        <title>Login</title>
        <link rel="stylesheet" href="css\login.css">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    </head>
    <!--Note from your login, certain people are able to access different stuff and different patients-->

    <body>
        <h1>
            <img src="meditrack.png" alt="" width="auto" height="auto">
        </h1>
        <div class="container">
            <form id="loginForm">
                <h2>Login</h2>

                <input id="username" class="UN" type="text" placeholder="Username" required>
                <input id="password" class="PASS" type="password" placeholder="Password" required>

                <p class="forgot">
                    <a href="#">Forgot Password?</a>
                </p>

                <button type="submit" class="btn">Login</button>

                <div class="register-link">
                    <p>Don't have an account?
                        <button type="button" onclick="window.location.href='Register.html'">
                            Register
                        </button>
                    </p>
                </div>
            </form>
        </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success === true) {
                    window.location.assign("Dashboard.html");
                } else {
                    alert("Invalid credentials");
                }

            } catch (err) {
                console.error("Login error:", err);
            }
        });
    </script>
    </body>
