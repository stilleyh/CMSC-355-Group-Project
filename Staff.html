        <script>
            window.onload = function () {
                fetch("/patients/load")
                .then(r => r.json())
                .then(data => {
                    console.log("Loaded patients:", data);
                });
            };
            initSidebar();

            function initSidebar() {
                $(".sidebar-dropdown > a").click(function () {
                    $(".sidebar-submenu").slideUp(200);
                    if ($(this).parent().hasClass("active")) {
                        $(".sidebar-dropdown").removeClass("active");
                        $(this).parent().removeClass("active");
                    } else {
                        $(".sidebar-dropdown").removeClass("active");
                        $(this).next(".sidebar-submenu").slideDown(200);
                        $(this).parent().addClass("active");
                    }
                });

                $("#close-sidebar").click(function () {
                    $(".page-wrapper").removeClass("toggled");
                });

                $("#show-sidebar").click(function () {
                    $(".page-wrapper").addClass("toggled");
                });
            };

            function saveStaff() {
                const staff = {
                    staff_id: Date.now(),

                    firstname: document.querySelector("#staff_first_name").value,
                    lastname: document.querySelector("#staff_last_name").value,
                    position: document.querySelector("#staff_position").value,
                    email: document.querySelector("#staff_email").value
                };

                fetch("/staff/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(staff)
                })
                .then(r => r.json())
                .then(console.log)
                .catch(console.error);
            }

        

            <!-- DATA -->


                
            function renderStaff(data) {
                const container = document.getElementById("staff-list");
                container.innerHTML = "";

                Object.values(data).forEach((s, index) => {
                    const row = document.createElement("div");
                    row.className = "staff-row";

                    row.innerHTML = `
                        <div>${s.firstname || ""}</div>
                        <div>${s.lastname || ""}</div>
                        <div>${s.position || ""}</div>
                        <div>${s.email || ""}</div>
                        <div>${index}</div>
                        <div><button class="btn btn-sm btn-primary">View</button></div>
                    `;

                    container.appendChild(row);
                });
            }

            window.onload = function () {

                fetch("/staff/load")
                .then(r => r.json())
                .then(data => {
                    console.log("Loaded staff:", data);
                    renderStaff(data);
                });

                fetch("/patients/load")
                .then(r => r.json())
                .then(data => console.log("Loaded patients:", data));

                fetch("/appointments/load")
                .then(r => r.json())
                .then(data => console.log("Loaded appointments:", data));

                initSidebar();
            };

            function initSidebar() {
                $(".sidebar-dropdown > a").click(function () {
                    $(".sidebar-submenu").slideUp(200);
                    if ($(this).parent().hasClass("active")) {
                        $(".sidebar-dropdown").removeClass("active");
                        $(this).parent().removeClass("active");
                    } else {
                        $(".sidebar-dropdown").removeClass("active");
                        $(this).next(".sidebar-submenu").slideDown(200);
                        $(this).parent().addClass("active");
                    }
                });

                $("#close-sidebar").click(() => $(".page-wrapper").removeClass("toggled"));
                $("#show-sidebar").click(() => $(".page-wrapper").addClass("toggled"));
            }


        </script>
