<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Staff list">
    <title>Staff</title>

    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/sidenav.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .staff-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .staff-header {
            font-weight: bold;
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<!-- SIDENAV (unchanged, keep yours here) -->
<div class="page-wrapper chiller-theme toggled">

    <a id="show-sidebar" class="btn btn-sm btn-dark" href="#">
        <i class="fas fa-bars"></i>
    </a>

    <nav id="sidebar" class="sidebar-wrapper">
        <div class="sidebar-content">

            <div class="sidebar-brand">
                <a href="Dashboard.html">
                    <img src="meditrack.png" style="width:150px;">
                </a>
                <div id="close-sidebar"><i class="fas fa-times"></i></div>
            </div>

        </div>
    </nav>
</div>

<h1>List of Staff</h1>

<!-- HEADER -->
<div class="staff-row staff-header">
    <div>First Name</div>
    <div>Last Name</div>
    <div>Position</div>
    <div>Email</div>
    <div>ID</div>
    <div>Action</div>
</div>

<!-- DATA -->
<div id="staff-list"></div>

<script>
function renderStaff(data) {
    const container = document.getElementById("staff-list");
    container.innerHTML = "";

    Object.values(data).forEach((s, index) => {
        const row = document.createElement("div");
        row.className = "staff-row";

        row.innerHTML = `
            <div>${s.firstname || ""}</div>
            <div>${s.lastname || ""}</div>
            <div>${s.position || ""}</div>
            <div>${s.email || ""}</div>
            <div>${index}</div>
            <div><button class="btn btn-sm btn-primary">View</button></div>
        `;

        container.appendChild(row);
    });
}

window.onload = function () {

    fetch("/staff/load")
        .then(r => r.json())
        .then(data => {
            console.log("Loaded staff:", data);
            renderStaff(data);
        });

    fetch("/patients/load")
        .then(r => r.json())
        .then(data => console.log("Loaded patients:", data));

    fetch("/appointments/load")
        .then(r => r.json())
        .then(data => console.log("Loaded appointments:", data));

    initSidebar();
};

function initSidebar() {
    $(".sidebar-dropdown > a").click(function () {
        $(".sidebar-submenu").slideUp(200);
        if ($(this).parent().hasClass("active")) {
            $(".sidebar-dropdown").removeClass("active");
            $(this).parent().removeClass("active");
        } else {
            $(".sidebar-dropdown").removeClass("active");
            $(this).next(".sidebar-submenu").slideDown(200);
            $(this).parent().addClass("active");
        }
    });

    $("#close-sidebar").click(() => $(".page-wrapper").removeClass("toggled"));
    $("#show-sidebar").click(() => $(".page-wrapper").addClass("toggled"));
}
</script>

</body>
</html>
