        <h2>Create Appoinment: </h2>

        <form action="">
            <h3>Patient's info:</h3>
            <div class="input-box">
                <input type="text" id="first_name" placeholder="First Name" required>
            </div>
            <br>
            <div class="input-box">
                <input type="text" id="middle_name" placeholder="Middle Name (Optional)">
            </div>
            <br>
            <div class="input-box">
                <input type="text" id="last_name" placeholder="Last Name" required>
            </div>
            <br>
            <div class="input-box">
                <input type="number" id="patientNumber" placeholder="Patient Number" required>
            </div>

            <h3>Subject/Reason: </h3>
            <div class="input-box">
                <input type="text" id="Subject" placeholder="Subject" required>
            </div>
            <br>
            <div class="input-box" id="bigBox">
                <input type="text" id="Reason" placeholder="Reason" required>
            </div>

            <h3>Schedule: </h3>
            <div>
                <input type="text" id="doctor" placeholder="Doctor">
            </div>
            <br>
            <div class="DateInput">
                <input type="date" name="scheduleDate" required>
            </div>
            <br>
            <div class="DateInput">
                <input type="time" name="scheduleTime" required>
            </div>
            <br>
            <div class="input-box">
                <input type="text" id="Room" placeholder="Room" required>
            </div>

            <h3>Extra: </h3>
            <select class="emergency"> <!--add later-->
                <option>Please enter urgency level</option>
                <option value="small">Low</option>
                <option value="small">Urgent</option>
                <option value="small">Critical</option>
                <option value="small">Life-threatening</option>
                

            </select>
            <br>
            <div class="input-box">
                <input type="text" id="notes" placeholder="Notes">
            </div>
            <br>
            <div style="overflow:auto; margin-top: 20px;">
                <div style="float:right;">
                    <button type="button" onclick="savePatients()">Submit</button>
                </div>
            </div>


        </form>





        <script>

            window.onload = function () {
                fetch("/patients/load")
                .then(r => r.json())
                .then(data => {
                    console.log("Loaded patients:", data);
                });
            };
            initSidebar();

            function initSidebar() {
                $(".sidebar-dropdown > a").click(function () {
                    $(".sidebar-submenu").slideUp(200);
                    if ($(this).parent().hasClass("active")) {
                        $(".sidebar-dropdown").removeClass("active");
                        $(this).parent().removeClass("active");
                    } else {
                        $(".sidebar-dropdown").removeClass("active");
                        $(this).next(".sidebar-submenu").slideDown(200);
                        $(this).parent().addClass("active");
                    }
                });

                $("#close-sidebar").click(function () {
                    $(".page-wrapper").removeClass("toggled");
                });

                $("#show-sidebar").click(function () {
                    $(".page-wrapper").addClass("toggled");
                });
            };

            function saveAppointment() {
                const appointment = {
                    appointment_id: Date.now(),

                    doctor: document.querySelector("#appointment_doctor").value,
                    room: document.querySelector("#appointment_room").value,
                    time: document.querySelector("#appointment_time").value,

                    procedure_reason: document.querySelector("#appointment_reason").value,

                    urgent: document.querySelector("#appointment_urgent")?.checked || false,

                    notes: [
                        document.querySelector("#appointment_notes").value
                    ],

                    // keep this simple for now (matches your backend reality better)
                    patient_details: {
                        patient_id: document.querySelector("#appointment_patient_id").value
                    }
                };

                    fetch("/appointments/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(appointment)
                    })
                    .then(r => r.json())
                    .then(console.log)
                    .catch(console.error);
                }

        </script>
